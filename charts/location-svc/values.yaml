# Default values for location-service.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

replicaCount: 1

autoscaler:
  min: 1
  max: 2
  targetCPU: 80

image:
  repository: asia.gcr.io/flex-rewards/location-service
  tag: latest
  pullPolicy: IfNotPresent

service:
  name: locationsvc
  type:
  port: 50070

env:
  data:
    LOG_FORMAT: "stackdriver"
    LOG_ENV: "production"
    REDIS_HOST_ADDRESS: "10.0.0.4:6379"
    REDIS_PASSWORD: ""
    REDIS_DB: 0
    GCP_SERVICE_ACCOUNT_CRED_FILE: "/secrets/location-service/location-service-flex-rewards-f5fab290826b.json"
    GCP_PROJECT_ID: "flex-rewards"

nodeSelector: {}

tolerations: []

affinity: {}

# Default values for app-server.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

replicaCount: 1

image:
  repository: asia.gcr.io/flex-rewards/update-stamp-store-id
  tag: latest
  pullPolicy: IfNotPresent

service:
  name: loyaltysvc
  type:
  port: 50100

env:
  data:
    LOG_LEVEL: "debug"
    LOG_ENV: "prod"
    PG_HOST: "cloudsqlsvc"
    PG_PORT: "5432"
    PG_NAME: "flex_loyalty_prod"
    PG_SSLMODE: "disable"
    REWARDS_SVC_ADDR: "rewardssvc:50040"

nodeSelector: {}

tolerations: []

affinity: {}

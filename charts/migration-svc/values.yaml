    GCP_PROJECT_ID: "flex-rewards"
    GCP_SERVICE_ACCOUNT_CRED_FILE: "/secrets/scribe-service/scribe-svc-flex-rewards-dd66400aaa3e.json"

nodeSelector: {}

tolerations: []

affinity: {}

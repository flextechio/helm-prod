# Default values for app-server.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

replicaCount: 1

image:
  repository: asia.gcr.io/flex-rewards/referral-web
  tag: latest
  pullPolicy: IfNotPresent

service:
  name: referralweb
  type: NodePort
  port: 2002

env:
  data:
    USERS_SVC_ADDR: "userssvc:50010"
    REWARDS_SVC_ADDR: "rewardssvc:50040"

nodeSelector: {}

tolerations: []

affinity: {}

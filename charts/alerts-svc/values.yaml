# Default values for app-server.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

replicaCount: 1

image:
  repository: asia.gcr.io/flex-rewards/alerts-service
  tag: latest
  pullPolicy: IfNotPresent

service:
  name: alertssvc
  type:
  port: 50150

env:
  data:
    LOG_FORMAT: "stackdriver"
    PG_HOST: "127.0.0.1"
    PG_PORT: "5432"
    PG_NAME: "flex_alerts_prod"
    PG_SSLMODE: "disable"

    USERS_SVC_ADDR: "userssvc:50010"
    REWARDS_SVC_ADDR: "rewardssvc:50040"
    LOYALTY_SVC_ADDR: "loyaltysvc:50100"
    COMPANIES_SVC_ADDR: "companiessvc:50160"

    GCP_PROJECT_ID: "flex-rewards"
    GCP_SERVICE_ACCOUNT_CRED_FILE: "/secrets/alerts-service/alerts-flex-rewards-e3b21fd78611.json"
    GCP_SERVICE_ACCOUNT_ACCESS_ID: "alerts-svc@flex-rewards.iam.gserviceaccount.com"
    GCP_SERVICE_ACCOUNT_PEM_FILE: "/secrets/alerts-key/alerts-prod.pem"

nodeSelector: {}

tolerations: []

affinity: {}

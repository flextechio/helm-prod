apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ template "scribe-svc.fullname" . }}
  labels:
    app: {{ template "scribe-svc.name" . }}
    chart: {{ template "scribe-svc.chart" . }}
    release: {{ .Release.Name }}
    heritage: {{ .Release.Service }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app: {{ template "scribe-svc.name" . }}
      release: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app: {{ template "scribe-svc.name" . }}
        release: {{ .Release.Name }}
    spec:
      containers:
        - name: {{ .Chart.Name }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          resources:
            requests:
              cpu: "40m"
              memory: "64Mi"
            limits:
              cpu: "100m"
              memory: "64Mi"
          ports:
            - name: scribe-svc
              containerPort: {{ .Values.service.port }}
          volumeMounts:
            - name: secrets
              mountPath: /secrets/scribe-service
              readOnly: true
          env:
            {{- range $key, $value := .Values.env.data }}
            - name: {{ $key }}
              value: {{ $value | quote }}
            {{- end}}
      volumes:
        - name: secrets
          secret:
            secretName: scribe-secrets

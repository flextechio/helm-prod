# Default values for location-service.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

replicaCount: 1

cronjob:
  name: airdrop-cronjob

image:
  repository: asia.gcr.io/flex-rewards/airdrop-job
  tag: latest
  pullPolicy: IfNotPresent

env:
  data:
    DB_DATA_SOURCE_NAME: "postgres://flexadmin-kubeaccess:AQVK7PShyGcdPPK9@cloudsqlsvc:5432/gc_rewards_prod?sslmode=disable"
    REWARDS_SVC_ADDR: "rewardssvc:50040"
    AUTHN_SVC_ADDR: "authnsvc:50020"
    LOCATIONS_SVC_ADDR: "locationsvc:50070"

job:
  name: airdrop-cronjob
  schedule: "*/1 * * * *"
  command: ["/bin/echo"]
  args:
  failedJobsHistoryLimit: 1
  successfulJobsHistoryLimit: 3
  concurrencyPolicy: Forbid

nodeSelector: {}

tolerations: []

affinity: {}

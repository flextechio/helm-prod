apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ template "app-server.fullname" . }}
  labels:
    app: {{ template "app-server.name" . }}
    chart: {{ template "app-server.chart" . }}
    release: {{ .Release.Name }}
    heritage: {{ .Release.Service }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app: {{ template "app-server.name" . }}
      release: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app: {{ template "app-server.name" . }}
        release: {{ .Release.Name }}
    spec:
      containers:
        - name: {{ .Chart.Name }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          resources:
            requests:
              cpu: "80m"
              memory: "128Mi"
            limits:
              cpu: "200m"
              memory: "250Mi"
          readinessProbe:
            httpGet:
              path: "/healthcheck"
              port: 2000
              scheme: HTTP
          livenessProbe:
            httpGet:
              path: "/healthcheck"
              port: 2000
              scheme: HTTP
          ports:
            - name: app-server
              containerPort: {{ .Values.service.port }}
          env:
            {{- range $key, $value := .Values.env.data }}
            - name: {{ $key }}
              value: {{ $value | quote }}
            {{- end}}

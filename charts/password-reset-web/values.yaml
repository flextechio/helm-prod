# Default values for app-server.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

replicaCount: 1

image:
  repository: asia.gcr.io/flex-rewards/password-reset-web
  tag: latest
  pullPolicy: IfNotPresent

service:
  name: pwdresetweb
  type: NodePort
  port: 2001

env:
  data:
    AUTHN_SVC_ADDR: "authnsvc:50020"

nodeSelector: {}

tolerations: []

affinity: {}

# Default values for app-server.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

replicaCount: 1

image:
  repository: asia.gcr.io/flex-rewards/update-welcome-rewards
  tag: latest
  pullPolicy: IfNotPresent

service:
  name: rewardssvc
  type:
  port: 50100

env:
  data:
    LOG_LEVEL: "debug"
    LOG_ENV: "prod"
    DB_HOST: "cloudsqlsvc"
    DB_PORT: "5432"
    DB_NAME: "gc_rewards_prod"
    DB_SSLMODE: "disable"
    LOYALTY_SVC_ADDR: "loyaltysvc:50100"
    REWARDS_SVC_ADDR: "rewardssvc:50040"

nodeSelector: {}

tolerations: []

affinity: {}

{{- if .Values.route53.createSecret }}
# Only rendered when route53.createSecret=true.
# Prefer creating this secret out-of-band with kubectl so the AWS secret
# access key is never committed to git:
#   kubectl -n {{ .Values.route53.secretNamespace }} create secret generic {{ .Values.route53.secretName }} \
#     --from-literal=secret-access-key='<AWS_SECRET_ACCESS_KEY>'
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.route53.secretName }}
  namespace: {{ .Values.route53.secretNamespace }}
type: Opaque
stringData:
  secret-access-key: {{ required "route53.secretAccessKey is required when createSecret=true" .Values.route53.secretAccessKey | quote }}
{{- end }}

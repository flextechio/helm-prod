apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: {{ .Values.issuer.name }}
spec:
  acme:
    server: {{ .Values.acme.server }}
    {{- if .Values.acme.email }}
    email: {{ .Values.acme.email }}
    {{- end }}
    privateKeySecretRef:
      name: {{ .Values.issuer.name }}-account-key
    solvers:
      - selector:
          dnsZones:
            - {{ .Values.certificate.dnsZone | quote }}
        dns01:
          route53:
            region: {{ .Values.route53.region }}
            {{- if .Values.route53.hostedZoneID }}
            hostedZoneID: {{ .Values.route53.hostedZoneID | quote }}
            {{- end }}
            accessKeyID: {{ .Values.route53.accessKeyID | quote }}
            secretAccessKeySecretRef:
              name: {{ .Values.route53.secretName }}
              key: secret-access-key

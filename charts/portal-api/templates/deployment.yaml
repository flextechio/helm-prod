apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ template "portal-api.fullname" . }}
  labels:
    app: {{ template "portal-api.name" . }}
    chart: {{ template "portal-api.chart" . }}
    release: {{ .Release.Name }}
    heritage: {{ .Release.Service }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app: {{ template "portal-api.name" . }}
      release: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app: {{ template "portal-api.name" . }}
        release: {{ .Release.Name }}
    spec:
      containers:
        - name: {{ .Chart.Name }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          resources:
            requests:
              cpu: "200m"
              memory: "64Mi"
            limits:
              cpu: "400m"
              memory: "128Mi"
          readinessProbe:
            httpGet:
              path: "/healthcheck"
              port: 2010
              scheme: HTTP
            initialDelaySeconds: 5
            periodSeconds: 60
            failureThreshold: 3
            timeoutSeconds: 1
            successThreshold: 1
          livenessProbe:
            httpGet:
              path: "/healthcheck"
              port: 2010
              scheme: HTTP
            initialDelaySeconds: 5
            periodSeconds: 60
            failureThreshold: 3
            timeoutSeconds: 1
            successThreshold: 1
          ports:
            - name: portal-api
              containerPort: {{ .Values.service.port }}
          env:
            {{- range $key, $value := .Values.env.data }}
            - name: {{ $key }}
              value: {{ $value | quote }}
            {{- end}}

apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ template "imagor.fullname" . }}
  labels:
    app: {{ template "imagor.name" . }}
    chart: {{ template "imagor.chart" . }}
    release: {{ .Release.Name }}
    heritage: {{ .Release.Service }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app: {{ template "imagor.name" . }}
      release: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app: {{ template "imagor.name" . }}
        release: {{ .Release.Name }}
    spec:
      containers:
        - name: {{ .Chart.Name }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          resources:
{{ toYaml .Values.resources | indent 12 }}
          ports:
            - name: http
              containerPort: {{ .Values.service.port }}
            - name: metrics
              containerPort: {{ .Values.metrics.port }}
          securityContext:
            allowPrivilegeEscalation: false
          volumeMounts:
            - name: google-application-credentials
              mountPath: /secrets/gcp
              readOnly: true
          env:
            {{- range $key, $value := .Values.env.data }}
            - name: {{ $key }}
              value: {{ $value | quote }}
            {{- end}}
            # Shared with image-svc THUMBOR_SECRET_KEY; created out-of-band, chart is public
            - name: IMAGOR_SECRET
              valueFrom:
                secretKeyRef:
                  name: image-signing-key
                  key: secret
          readinessProbe:
            tcpSocket:
              port: {{ .Values.service.port }}
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: {{ .Values.service.port }}
            initialDelaySeconds: 15
            periodSeconds: 20
      volumes:
        - name: google-application-credentials
          secret:
            secretName: google-application-credentials

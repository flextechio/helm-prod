# Default values for app-server.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

replicaCount: 2

autoscaler:
  min: 2
  max: 4
  targetCPU: 80

image:
  repository: asia.gcr.io/flex-rewards/image-service
  tag: latest
  pullPolicy: IfNotPresent

service:
  name: imgsvc
  type:
  port: 50060

env:
  data:
    LOG_FORMAT: "stackdriver"
    LOG_ENV: "prod"
    DB_HOST: "127.0.0.1"
    DB_PORT: "5432"
    DB_NAME: "gc_images_prod"
    DB_SSLMODE: "disable"
    IMG_BUCKET: "thumbor-imageoriginals-prod"
    KYC_BUCKET: "kyc-verify-prod"
    GOOGLE_SERVICE_ACCOUNT: "flex-storage-access@flex-rewards.iam.gserviceaccount.com"
    GOOGLE_APPLICATION_CREDENTIALS: "/secrets/gcp/flex-rewards-c0eba827a6f7.json"
    GOOGLE_PRIVATE_KEY: "/secrets/privkey/privkey-prod.pem"
    CDN_URL: "images.flexrewards.io"
    IMAGE_ENGINE: "imagor"
    SIGNED_URL_EXPIRY: "900"

nodeSelector: {}

tolerations: []

affinity: {}

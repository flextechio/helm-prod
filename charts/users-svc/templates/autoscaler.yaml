apiVersion: autoscaling/v1
kind: HorizontalPodAutoscaler
metadata:
  name: {{ template "users-svc.fullname" . }}
  namespace: default
spec:
  maxReplicas: {{ .Values.autoscaler.max }}
  minReplicas: {{ .Values.autoscaler.min }}
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: {{ template "users-svc.fullname" . }}
  targetCPUUtilizationPercentage: {{ .Values.autoscaler.targetCPU }}
status:
  currentReplicas: 0
  desiredReplicas: 0

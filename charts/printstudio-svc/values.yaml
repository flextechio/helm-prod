# Default values for app-server.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

replicaCount: 1

autoscaler:
  min: 1
  max: 2
  targetCPU: 80

image:
  repository: asia.gcr.io/flex-rewards/printstudio-service
  tag: latest
  pullPolicy: IfNotPresent

service:
  name: printstudiosvc
  type:
  port: 50110

env:
  data:
    LOG_FORMAT: "stackdriver"
    PG_HOST: "127.0.0.1"
    PG_PORT: "5432"
    PG_NAME: "flex_printstudio_prod"
    PG_SSLMODE: "disable"
    REWARDS_SVC_ADDR: "rewardssvc:50040"
    LOYALTY_SVC_ADDR: "loyaltysvc:50100"
    IMAGE_SVC_ADDR: "imgsvc:50060"
    COMPANIES_SVC_ADDR: "companiessvc:50160"
    GCP_PROJECT_ID: "flex-rewards"
    GCP_SERVICE_ACCOUNT_CRED_FILE: "/secrets/printstudio-service/printstudio-flex-rewards-9cb511eb672b.json"
    GCP_SERVICE_ACCOUNT_ACCESS_ID: "printstudio-service@flex-rewards.iam.gserviceaccount.com"
    GCP_SERVICE_ACCOUNT_PEM_FILE: "/secrets/printstudio-key/printstudio-prod-key.pem"
    SET_PDF_BUCKET_NAME: "print-studio-pdf"
    SET_CSV_BUCKET_NAME: reports-csv-flexprod
    APPLINK_DOMAIN_URI_PREFIX: https://flexrewards.app.link
    APPLINK_FALLBACK_URI_PREFIX: https://partner.flexrewards.io

nodeSelector: {}

tolerations: []

affinity: {}

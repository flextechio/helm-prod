# Default values for app-server.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

replicaCount: 1

image:
  repository: asia.gcr.io/flex-rewards/loyalty-web
  tag: latest
  pullPolicy: IfNotPresent

service:
  name: loyaltyweb
  type: NodePort
  port: 2003

env:
  data:
    REWARDS_SVC_ADDR: "rewardssvc:50040"
    LOYALTY_SVC_ADDR: "loyaltysvc:50100"
    COMPANIES_SVC_ADDR: "companiessvc:50160"
    ANDROID_PACKAGE_NAME: "io.flexrewards.app.store"
    DOMAIN_URI_PREFIX: "https://flexrewards.app.link"
    IOS_APP_STORE_ID: "1440722694"
    IOS_BUNDLE_ID: "io.flexrewards.app.store"
    LINK_URI_PREFIX: "https://flexrewards.io"
    WEBAPP_URI_PREFIX: "https://online.flexrewards.io"

nodeSelector: {}

tolerations: []

affinity: {}

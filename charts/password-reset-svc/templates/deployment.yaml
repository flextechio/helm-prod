apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ template "password-reset-svc.fullname" . }}
  labels:
    app: {{ template "password-reset-svc.name" . }}
    chart: {{ template "password-reset-svc.chart" . }}
    release: {{ .Release.Name }}
    heritage: {{ .Release.Service }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app: {{ template "password-reset-svc.name" . }}
      release: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app: {{ template "password-reset-svc.name" . }}
        release: {{ .Release.Name }}
    spec:
      containers:
        - name: {{ .Chart.Name }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          resources:
            requests:
              cpu: "10m"
              memory: "10Mi"
            limits:
              cpu: "20m"
              memory: "20Mi"
          readinessProbe:
            httpGet:
              path: "/healthcheck"
              port: 2001
              scheme: HTTP
          livenessProbe:
            httpGet:
              path: "/healthcheck"
              port: 2001
              scheme: HTTP
          ports:
            - name: pwdresetsvc
              containerPort: {{ .Values.service.port }}
          env:
            {{- range $key, $value := .Values.env.data }}
            - name: {{ $key }}
              value: {{ $value | quote }}
            {{- end}}
